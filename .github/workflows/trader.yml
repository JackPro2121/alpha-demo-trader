name: demo-trader

on:
  workflow_dispatch:
    inputs:
      once:
        description: "single cycle then exit (probe mode)"
        required: false
        default: "false"
      symbols:
        description: "comma list"
        required: false
        default: "EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,USDCHF"
      timeframe:
        description: "decision timeframe"
        required: false
        default: "H1"
  schedule:
    # Forex Trading Hours Only (Closed Saturday & Sunday Daytime):
    # Sunday evening market open (21:05 UTC for Sydney open):
    - cron: "5 21 * * 0"
    # Monday through Thursday (every ~5 hours across all active trading sessions):
    - cron: "5 0,5,10,15,20 * * 1-4"
    # Friday (runs during London/NY sessions until Friday market close ~21:05 UTC):
    - cron: "5 0,5,10,15 * * 5"

permissions:
  contents: read

concurrency:
  group: demo-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      ALPHA_CONNECTOR: mcp
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MT5_MCP_TOKEN: ${{ secrets.MT5_MCP_TOKEN }}
      ALFA_REPO_TOKEN: ${{ secrets.ALFA_REPO_TOKEN }}
      ALPHA_PERSIST_TOKEN: ${{ secrets.ALFA_REPO_TOKEN }}
      ALPHA_PERSIST_REPO: alpha-data-store
    steps:
      - name: Check Forex Market Open (Weekend Guard)
        id: market_check
        shell: pwsh
        run: |
          $forceOnce = "${{ github.event.inputs.once }}"
          $now = [DateTime]::UtcNow
          $day = [int]$now.DayOfWeek # 0 = Sunday, 5 = Friday, 6 = Saturday
          $hour = $now.Hour

          # Market closure rules:
          # - Saturday: completely closed all day
          # - Sunday: closed before 21:00 UTC (Sydney opens ~21:00-22:00 UTC)
          # - Friday: closed after 22:00 UTC
          $isClosed = ($day -eq 6) -or ($day -eq 0 -and $hour -lt 21) -or ($day -eq 5 -and $hour -ge 22)

          if ($isClosed -and ($forceOnce -ne "true")) {
            Write-Host "=========================================================="
            Write-Host "FOREX MARKET IS CLOSED FOR THE WEEKEND (UTC: $now)."
            Write-Host "Market reopens Sunday at 21:00 UTC (Sydney session open)."
            Write-Host "Skipping execution to save compute resources."
            Write-Host "=========================================================="
            "is_open=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "=========================================================="
            Write-Host "FOREX MARKET IS OPEN (UTC: $now)."
            Write-Host "Proceeding with automated cloud trading runner."
            Write-Host "=========================================================="
            "is_open=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: actions/checkout@v4
        if: steps.market_check.outputs.is_open == 'true'

      - uses: actions/checkout@v4
        if: steps.market_check.outputs.is_open == 'true'
        with:
          repository: JackPro2121/alpha-data-store
          token: ${{ secrets.ALFA_REPO_TOKEN }}
          path: alpha-data-store

      - name: Clone ALPHA engine (private)
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.ALFA_REPO_TOKEN }}@github.com/ranajawadai/ALPHAFOREX.git ALFAFOREX

      - uses: actions/setup-python@v5
        if: steps.market_check.outputs.is_open == 'true'
        with:
          python-version: "3.12"

      - name: Install python deps
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        run: |
          pip install -r ALFAFOREX/requirements.txt
          pip install --upgrade MetaTrader5

      - name: Install MT5 terminal (silent)
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        run: ./scripts/setup_mt5.ps1

      - name: Broker login + demo gate
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        env:
          MT5_ACCOUNT_JSON_OUT: ${{ runner.temp }}/mt5-config/account_info_login.json
        run: |
          $mt5Path = if ($env:MT5_PATH) { $env:MT5_PATH } else { "C:\Program Files\MetaTrader 5\terminal64.exe" }
          $env:MT5_PATH = $mt5Path
          Write-Host "MT5_PATH=$mt5Path"
          $loginScript = Join-Path $env:GITHUB_WORKSPACE "scripts\mt5_login.py"
          $ok = $false
          foreach ($i in 1..3) {
            Write-Host "=== mt5_login attempt $i/3 ==="
            python $loginScript
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            throw "MetaTrader5 account capability check failed; refusing to start watcher"
          }
          $dumpScript = Join-Path $env:GITHUB_WORKSPACE "scripts\dump_mt5_account.py"
          Write-Host "=== MCP account dump (post-login) ==="
          python $dumpScript --wait=15 --out="$env:RUNNER_TEMP\mt5-config\account_info.json"
          $acct = "$env:RUNNER_TEMP\mt5-config\account_info.json"
          $ready = $false
          if (Test-Path $acct) {
            try {
              $s = (Get-Content $acct -Raw | ConvertFrom-Json).summary
              Write-Host ("MCP_ACCOUNT login={0} server={1} type={2} balance={3} connected={4} mcp_trade_allowed={5} experts_trade_allowed={6} ready={7}" -f `
                $s.login, $s.server, $s.type, $s.balance, $s.server_connected, $s.mcp_trade_allowed, $s.experts_trade_allowed, $s.ready_for_demo_trading)
              if ($s.ready_for_demo_trading -and $s.server_connected -eq $true -and $s.mcp_trade_allowed -eq $true -and $s.experts_trade_allowed -eq $true) { $ready = $true }
            } catch { Write-Host "account json parse failed: $_" }
          }
          if (-not $ready) {
            throw "MT5 broker authentication/demo readiness failed; refusing to start watcher"
          }
          Write-Host "MT5_LOGIN_STATUS: DEMO_READY"

      - name: Run watcher
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        working-directory: ALFAFOREX/forexgpt-3.0
        run: |
          $rawOnce = "${{ github.event.inputs.once }}"
          $rawSyms = "${{ github.event.inputs.symbols }}"
          $rawTf = "${{ github.event.inputs.timeframe }}"
          $syms = if ($rawSyms -and $rawSyms.Trim()) { $rawSyms.Trim() } else { "EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD,NZDUSD,USDCHF" }
          $tf = if ($rawTf -and $rawTf.Trim()) { $rawTf.Trim() } else { "H1" }
          Write-Host "Starting watcher with symbols: $syms | timeframe: $tf"
          if ($rawOnce -eq "true") {
            python -u -m forexgpt3.scripts.live_watch --once `
              --symbols "$syms" `
              --timeframe "$tf"
          } else {
            $end = (Get-Date).AddMinutes(315)
            while ((Get-Date) -lt $end) {
              # Check if Friday market close reached during loop
              $nowUtc = [DateTime]::UtcNow
              if ($nowUtc.DayOfWeek -eq [DayOfWeek]::Friday -and $nowUtc.Hour -ge 22) {
                Write-Host "Friday 22:00 UTC reached -- market closed for weekend. Exiting loop cleanly."
                break
              }
              if ($nowUtc.DayOfWeek -eq [DayOfWeek]::Saturday) {
                Write-Host "Saturday reached -- market closed. Exiting loop cleanly."
                break
              }

              python -u -m forexgpt3.scripts.live_watch --once `
                --symbols "$syms" `
                --timeframe "$tf"
              Start-Sleep -Seconds 60
            }
          }

      - name: Persist journal to data-store
        if: steps.market_check.outputs.is_open == 'true'
        shell: pwsh
        working-directory: ALFAFOREX/forexgpt-3.0
        run: |
          python ../../scripts/persist_journal.py
        env:
          STORE_DIR: ${{ github.workspace }}/alpha-data-store

      - name: Upload journal artifact
        if: steps.market_check.outputs.is_open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: ALFAFOREX/forexgpt-3.0/data-runtime/platform.db
          retention-days: 30

      - name: Upload MT5 config diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-config-${{ github.run_id }}
          path: ${{ runner.temp }}/mt5-config
          retention-days: 30
          if-no-files-found: ignore
